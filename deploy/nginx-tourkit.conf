# Nginx reverse proxy cho Tourkit.
# Copy vao /etc/nginx/sites-available/tourkit roi:
#   sudo ln -s /etc/nginx/sites-available/tourkit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Sau do bat HTTPS mien phi:
#   sudo certbot --nginx -d landing.tourkit.vn
# (certbot se tu them block listen 443 + chung chi vao file nay)

server {
    listen 80;
    server_name landing.tourkit.vn;

    # Cho phep upload file lon (vd PDF trong admin)
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # (Tuy chon) Nginx phuc vu file tinh truc tiep cho nhanh:
    # location /_next/static/ {
    #     alias /var/www/tourkit/dist/.next/static/;
    #     expires 1y;
    #     access_log off;
    # }
}
